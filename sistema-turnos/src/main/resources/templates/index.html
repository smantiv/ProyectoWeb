<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de Vigilancia Escolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page page-login">
    <nav class="topbar">
      <div class="brand">
        <img src="assets/logo-sfr.png" alt="Logo Santa Francisca Romana" class="brand-logo small-round">
        <span class="brand-title">Sistema de Vigilancia Escolar</span>
      </div>
    </nav>

    <main class="main-center">
      <section class="login-header">
        <div class="hero-logo-wrap">
          <img src="assets/logo-sfr.png" alt="Logo Santa Francisca Romana" class="hero-logo">
        </div>
        <h1>Bienvenido al Sistema de Vigilancia</h1>
        <p>Accede con tu cuenta institucional para gestionar los turnos de vigilancia escolar.</p>
      </section>

      <section class="card login-card">
        <h2>Iniciar Sesión</h2>

        <form id="loginForm" class="form-stack">
          <div class="field">
            <label for="email">Email o Usuario</label>
            <input id="email" type="text" placeholder="tu.email@sfr.edu">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            Ingresar
          </button>

          <div class="center-link">
            <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
          </div>
        </form>
      </section>

      <section class="quick-access">
        <p class="quick-access-title">Acceso Rápido - Explorar como:</p>

        <div class="role-grid">
          <button class="role-card role-profesor" data-link="docente/dashboard.html">
            <div class="role-icon-circle">👤</div>
            <span>Profesor</span>
          </button>

          <button class="role-card role-coordinador" data-link="coordinador/panel.html">
            <div class="role-icon-circle">🛡️</div>
            <span>Coordinador</span>
          </button>

          <button class="role-card role-admin" data-link="administrador/panel.html">
            <div class="role-icon-circle">⚙️</div>
            <span>Administrador</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>
        <span class="footer-school">Colegio Santa Francisca Romana</span> &copy; 2026
      </p>
      <div class="footer-links">
        <a href="soporte.html">Soporte</a>
        <span>|</span>
        <a href="contacto.html">Contacto</a>
      </div>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
