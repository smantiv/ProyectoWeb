<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Gestión de Incidentes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div class="page">

    <nav class="topbar">
      <div class="brand">
        <img src="/assets/logo-sfr.png" class="brand-logo">
        <span class="brand-title small-text">Sistema de Vigilancia Escolar</span>
      </div>

      <div class="profile-box">
        <span>Coord. Alberto Ramírez</span>
        <a href="#" class="profile-avatar profile-avatar-coord">👤</a>
      </div>
    </nav>

    <main class="mis-turnos-main">

      <div class="back-wrap">
        <button class="back-btn" onclick="history.back()">←</button>
      </div>

      <div class="container incidents-page-wrap">

        <section class="section-header">
          <h1>Gestión de Incidentes</h1>
          <p>Supervisa y gestiona los incidentes reportados por los profesores.</p>
        </section>

        <!-- FILTROS -->
        <section class="section">
          <div class="filter-card">
            <h3>Filtros</h3>

            <div class="filter-grid">

              <div class="filter-field">

                <label>Estado</label>
                <select id="filtroEstado">
                  <option value="">Todos</option>
                  <option value="reportado">Pendiente</option>
                  <option value="en_revision">En proceso</option>
                  <option value="resuelto">Resuelto</option>
                  <option value="escalado">Escalado</option>
                </select>
              </div>

              <div class="filter-field">
                <label>Prioridad</label>
                <select id="filtroPrioridad">
                  <option value="">Todos</option>
                  <option value="baja">Baja</option>
                  <option value="media">Media</option>
                  <option value="alta">Alta</option>
                  <option value="critica">Crítica</option>
                </select>
              </div>

              <div class="filter-field">
                <label>Zona</label>
                <select id="filtroZona">
                  <option value="">Todos</option>
                  <option value="Patio principal">Patio principal</option>
                  <option value="Biblioteca">Biblioteca</option>
                  <option value="Cafetería">Cafetería</option>
                  <option value="Entrada principal">Entrada principal</option>
                  <option value="Zona de juegos">Zona de juegos</option>
                  <option value="Pasillo académico">Pasillo académico</option>
                </select>
              </div>
            </div>
        </section>

        <!-- TABLA -->
        <section class="section">
          <h2>Incidentes <span id="contador">(0)</span></h2>

          <table class="incidents-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Ubicación</th>
                <th>Hora</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Descripción</th>
              </tr>
            </thead>

            <tbody id="tablaIncidentes"></tbody>
          </table>
        </section>

      </div>
    </main>

    <footer class="footer">
      <p>Colegio Santa Francisca Romana © 2026</p>
    </footer>

  </div>

  <!-- SCRIPT LIMPIO -->
  <script>

    document.addEventListener("DOMContentLoaded", cargarIncidentes);

    async function cargarIncidentes() {
      try {
        const response = await fetch("/api/v1/incidentes");
        const incidentes = await response.json();

        const tabla = document.getElementById("tablaIncidentes");
        const contador = document.getElementById("contador");

        tabla.innerHTML = "";
        contador.textContent = `(${incidentes.length})`;

        console.log("INCIDENTES:", incidentes);
        incidentes.forEach(inc => {
          tabla.innerHTML += `
        <tr>
          <td>${inc.tipo}</td>
          <td>${inc.ubicacion ?? "Sin ubicación"}</td>
          <td>${inc.fechaHora ? inc.fechaHora.substring(11, 16) : "-"}</td>
          <td>${inc.severidad ?? "-"}</td>
          <td>${inc.estado ?? "-"}</td>
          <td>${inc.descripcion ?? "-"}</td>

        </tr>
      `;
        });

      } catch (error) {
        console.error("Error:", error);
      }
    }

    function capitalizar(texto) {
      if (!texto) return "-";
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

  </script>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  cargarIncidentes();

  document.getElementById("filtroEstado").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroPrioridad").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroZona").addEventListener("change", aplicarFiltros);
});

let incidentesGlobal = [];

async function cargarIncidentes() {
  try {
    const response = await fetch("/api/v1/incidentes");
    const incidentes = await response.json();

    incidentesGlobal = incidentes;
    aplicarFiltros();

  } catch (error) {
    console.error("Error cargando incidentes:", error);
  }
}

function aplicarFiltros() {
  const filtroEstado = limpiarTexto(document.getElementById("filtroEstado").value);
  const filtroPrioridad = limpiarTexto(document.getElementById("filtroPrioridad").value);
  const filtroZona = limpiarTexto(document.getElementById("filtroZona").value);

  const filtrados = incidentesGlobal.filter(inc => {
    const estado = normalizarEstado(inc.estado);
    const severidad = limpiarTexto(inc.severidad);
    const ubicacion = limpiarTexto(inc.ubicacion);

    const coincideEstado = !filtroEstado || estado === filtroEstado;
    const coincidePrioridad = !filtroPrioridad || severidad === filtroPrioridad;
    const coincideZona = !filtroZona || ubicacion === filtroZona;

    return coincideEstado && coincidePrioridad && coincideZona;
  });

  renderTabla(filtrados);
}

function renderTabla(incidentes) {
  const tabla = document.getElementById("tablaIncidentes");
  tabla.innerHTML = "";

  if (incidentes.length === 0) {
    tabla.innerHTML = `
      <tr>
        <td colspan="7" style="text-align:center; padding: 20px;">
          No hay incidentes que coincidan con los filtros.
        </td>
      </tr>
    `;
    return;
  }

  incidentes.forEach(inc => {
    tabla.innerHTML += `
      <tr class="incidents-row">
        <td>${inc.tipo ?? "-"}</td>
        <td>${inc.ubicacion ?? "-"}</td>
        <td>${inc.fechaHora ? inc.fechaHora.substring(11,16) : "-"}</td>
        <td>${badgeSeveridad(inc.severidad)}</td>
        <td>${badgeEstado(inc.estado)}</td>
        <td>${inc.descripcion ?? "-"}</td>
       
      </tr>
    `;
  });
}

function limpiarTexto(texto) {
  return String(texto || "").toLowerCase().trim();
}

function normalizarEstado(estado) {
  const valor = limpiarTexto(estado);

  if (valor === "pendiente") return "reportado";
  if (valor === "en proceso") return "en_revision";

  return valor;
}

function badgeSeveridad(severidad) {
  const valor = limpiarTexto(severidad);

  const map = {
    baja: "incident-priority-low",
    media: "incident-priority-medium",
    alta: "incident-priority-high",
    critica: "incident-priority-critical",
    crítica: "incident-priority-critical"
  };

  return `<span class="incident-badge ${map[valor] || ""}">
            ${capitalizar(valor)}
          </span>`;
}

function badgeEstado(estado) {
  const valor = normalizarEstado(estado);

  const map = {
    reportado: "incident-status-pending",
    en_revision: "incident-status-progress",
    resuelto: "incident-status-resolved",
    escalado: "incident-status-progress"
  };

  const texto = {
    reportado: "Pendiente",
    en_revision: "En proceso",
    resuelto: "Resuelto",
    escalado: "Escalado"
  };

  return `<span class="incident-badge ${map[valor] || ""}">
            ${texto[valor] || capitalizar(valor)}
          </span>`;
}

function capitalizar(texto) {
  if (!texto) return "-";
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

async function resolverIncidente(id) {
  try {
    const confirmar = confirm("¿Deseas marcar este incidente como resuelto?");
    if (!confirmar) return;

    const response = await fetch(`/api/v1/incidentes/${id}`);
    if (!response.ok) {
      throw new Error("No se pudo obtener el incidente");
    }

    const incidente = await response.json();
    incidente.estado = "resuelto";

    const updateResponse = await fetch(`/api/v1/incidentes/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(incidente)
    });

    if (!updateResponse.ok) {
      throw new Error("No se pudo actualizar el incidente");
    }

    cargarIncidentes();

  } catch (error) {
    console.error("Error al resolver incidente:", error);
    alert("Hubo un error al actualizar el estado.");
  }
}
</script>

</body>

</html>
